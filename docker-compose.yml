version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuelpass-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - fuelpass-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: fuelpass-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fuelpass
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: fuelpass
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - fuelpass-mysql-data:/var/lib/mysql
    networks:
      - fuelpass-network

  nginx:
    image: nginx:alpine
    container_name: fuelpass-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fuelpass-network
    depends_on:
      - app

networks:
  fuelpass-network:
    driver: bridge

volumes:
  fuelpass-mysql-data:
